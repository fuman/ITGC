spring:
  application:
    name: itgc-portal

  # PostgreSQL + HikariCP 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/itgcdb
    driver-class-name: org.postgresql.Driver
    username: itgc_user
    password: itgc_password
    hikari:
      pool-name: ItgcHikariPool
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 600000       # 10분
      connection-timeout: 30000  # 30초
      max-lifetime: 1800000      # 30분
      connection-test-query: SELECT 1
      auto-commit: false

  # 파일 업로드
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# MyBatis 설정
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.itgc.portal.model
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: false
    use-generated-keys: true

# PageHelper 설정
pagehelper:
  helper-dialect: postgresql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

server:
  port: 8080
  servlet:
    context-path: /

# CORS
cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"

# JWT
jwt:
  secret: itgc-portal-jwt-secret-key-2026-for-development-only
  expiration: 86400000  # 24시간

# Logging
logging:
  level:
    com.itgc: DEBUG
    org.springframework.security: DEBUG
    org.mybatis: DEBUG
    java.sql.PreparedStatement: DEBUG

---
# 운영 환경
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://localhost:5432/itgcdb
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: ItgcHikariPool-Prod
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000

logging:
  level:
    com.itgc: INFO
    org.mybatis: WARN
